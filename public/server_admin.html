<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw - Control Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0b1120;
            color: #fff;
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .status-badge {
            background: #0284c7;
            color: #e0f2fe;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }
        .card {
            background: #162032;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #24334a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #2d3f5d;
            background: #0b1120;
            color: #fff;
            width: 100%;
        }
        button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            background: #0ea5e9;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.danger { background: #ef4444; }
        button.warning { background: #f97316; }
        button.success { background: #22c55e; }
        ul {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }
        li {
            padding: 10px 12px;
            border-bottom: 1px solid #202d42;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1726;
            margin-bottom: 6px;
            border-radius: 6px;
        }
        .prize-actions, .user-actions {
            display: flex;
            gap: 6px;
        }
        .prize-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qty-badge {
            background: #1e293b;
            color: #38bdf8;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d1726;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #0ea5e9;
        }
        .winner-item {
            padding: 12px;
            background: #0d1726;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            border-left: 3px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CONTROL CENTER</h1>
        <div class="status-badge">
            <span class="status-dot"></span> LIVE SERVER CONNECTED
        </div>
    </div>

    <div class="grid">
        <!-- Wheel Prize Manager Card -->
        <div class="card">
            <h2>⚙️ Wheel Prize Manager</h2>
            <div class="form-group">
                <input type="text" id="prizeLabel" placeholder="New Prize Name">
                <input type="number" id="prizeQty" placeholder="Qty" value="1" min="1" style="width: 80px;">
                <input type="color" id="prizeColor" value="#0a4d70" style="width: 50px; padding: 2px; cursor: pointer;">
                <button id="addPrizeBtn">Add</button>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-size: 0.85rem; color: #64748b;">Active Wheel Items</span>
                <button class="warning" id="resetPrizesBtn" style="padding: 6px 12px; font-size: 0.8rem;">Reset Default</button>
            </div>

            <ul id="prizeList"></ul>
        </div>

        <!-- User Access & Management Card -->
        <div class="card">
            <h2>👥 User Management (CRUD)</h2>
            
            <!-- User Insert Form -->
            <div class="form-group">
                <input type="text" id="newUserId" placeholder="User ID (e.g. ID006)">
                <input type="text" id="newUserName" placeholder="Name (e.g. John)">
                <button class="success" id="addUserBtn">Add User</button>
            </div>

            <button class="warning" id="resetSpunsBtn" style="width: 100%; padding: 10px; font-size: 0.9rem; margin-bottom: 15px;">
                Reset Spin Limits for All Users
            </button>

            <h3 style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">Registered Users List</h3>
            <div id="usersList" style="max-height: 180px; overflow-y: auto; margin-bottom: 20px;"></div>

            <h3 style="font-size: 0.95rem; color: #cbd5e1; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
                📜 Private Server Winner History
            </h3>
            
            <div id="winnerHistory" style="max-height: 180px; overflow-y: auto;">
                <p style="color: #64748b; font-size: 0.85rem;">No winners yet...</p>
            </div>
        </div>
    </div>

    <script>
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}`);

        const prizeLabel = document.getElementById('prizeLabel');
        const prizeQty = document.getElementById('prizeQty');
        const prizeColor = document.getElementById('prizeColor');
        const addPrizeBtn = document.getElementById('addPrizeBtn');
        const prizeList = document.getElementById('prizeList');
        const resetPrizesBtn = document.getElementById('resetPrizesBtn');
        const resetSpunsBtn = document.getElementById('resetSpunsBtn');
        const winnerHistory = document.getElementById('winnerHistory');

        const newUserId = document.getElementById('newUserId');
        const newUserName = document.getElementById('newUserName');
        const addUserBtn = document.getElementById('addUserBtn');
        const usersList = document.getElementById('usersList');

        let prizes = [];

        function renderPrizeList() {
            if (!prizes || prizes.length === 0) {
                prizeList.innerHTML = '<p style="color: #64748b; font-size: 0.85rem;">No prizes found.</p>';
                return;
            }

            prizeList.innerHTML = prizes.map((prize, index) => `
                <li>
                    <div class="prize-info">
                        <span style="color: ${prize.color}; font-weight: 600;">■ ${prize.label}</span>
                        <span class="qty-badge">Qty: ${prize.quantity}/${prize.initial_quantity}</span>
                    </div>
                    <div class="prize-actions">
                        <button onclick="editPrize(${prize.id}, '${prize.label}', ${prize.initial_quantity})" style="padding: 4px 8px; font-size: 0.75rem;">Edit</button>
                        <button class="danger" onclick="removePrize(${prize.id}, ${index})" style="padding: 4px 8px; font-size: 0.75rem;">Delete</button>
                    </div>
                </li>
            `).join('');
        }

        function renderUsersList(users) {
            if (!users || users.length === 0) {
                usersList.innerHTML = '<p style="color: #64748b; font-size: 0.85rem;">No users found.</p>';
                return;
            }

            usersList.innerHTML = users.map(u => `
                <div class="user-item">
                    <span style="font-size: 0.85rem;">
                        <b style="color:#38bdf8;">${u.user_id}</b> - ${u.name} 
                        ${u.has_spun ? '<span style="color:#f97316; font-size: 0.75rem;">(Spun)</span>' : ''}
                    </span>
                    <div class="user-actions">
                        <button onclick="editUser('${u.user_id}', '${u.name}')" style="padding: 3px 8px; font-size: 0.75rem;">Edit</button>
                        <button class="danger" onclick="deleteUser('${u.user_id}')" style="padding: 3px 8px; font-size: 0.75rem;">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function renderWinnerList(winners) {
            if (!winners || winners.length === 0) {
                winnerHistory.innerHTML = '<p style="color: #64748b; font-size: 0.85rem;">No winners yet...</p>';
                return;
            }

            winnerHistory.innerHTML = winners.map(w => {
                const userName = w.name || w.userName || w.username || 'User';
                const prizeName = w.won_prize || w.prize || w.prizeName || 'Prize';

                return `
                    <div class="winner-item">
                        🏆 <strong>${userName}</strong> won <span style="color: #38bdf8; font-weight: bold;">${prizeName}</span>
                    </div>
                `;
            }).join('');
        }

        // EDIT PRIZE - Updates label and initial_quantity only
        function editPrize(id, currentLabel, currentInitialQty) {
            const newLabel = prompt(`Edit Prize Name:`, currentLabel);
            if (newLabel === null) return;

            const newInitialQty = prompt(`Edit Initial Quantity:`, currentInitialQty);
            if (newInitialQty === null) return;

            const parsedQty = parseInt(newInitialQty);
            if (newLabel.trim() !== '' && !isNaN(parsedQty) && parsedQty > 0) {
                ws.send(JSON.stringify({
                    type: 'UPDATE_PRIZE',
                    id: id,
                    label: newLabel.trim(),
                    initial_quantity: parsedQty
                }));
            } else {
                alert("Please provide valid inputs.");
            }
        }

        function removePrize(id, index) {
            if (confirm("Are you sure you want to delete this prize?")) {
                ws.send(JSON.stringify({ type: 'DELETE_PRIZE', id, index }));
            }
        }

        function editUser(userId, currentName) {
            const newName = prompt(`Update Name for User ID: ${userId}`, currentName);
            if (newName && newName.trim() !== '') {
                ws.send(JSON.stringify({ type: 'UPDATE_USER', userId, name: newName.trim() }));
            }
        }

        function deleteUser(userId) {
            if (confirm(`Are you sure you want to delete user ${userId}?`)) {
                ws.send(JSON.stringify({ type: 'DELETE_USER', userId }));
            }
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'INIT') {
                prizes = data.prizes;
                renderPrizeList();
                if (data.winners) renderWinnerList(data.winners);
                if (data.users) renderUsersList(data.users);
            }

            if (data.type === 'UPDATE_PRIZES') {
                prizes = data.prizes;
                renderPrizeList();
            }

            if (data.type === 'UPDATE_WINNERS') {
                renderWinnerList(data.winners);
            }

            if (data.type === 'UPDATE_USERS') {
                renderUsersList(data.users);
            }
        };

        addPrizeBtn.addEventListener('click', () => {
            const label = prizeLabel.value.trim();
            const color = prizeColor.value;
            const initial_quantity = parseInt(prizeQty.value) || 1;

            if (!label) {
                alert("Please enter a prize name.");
                return;
            }

            ws.send(JSON.stringify({ 
                type: 'ADD_PRIZE', 
                label, 
                color,
                initial_quantity 
            }));

            prizeLabel.value = '';
            prizeQty.value = '1';
        });

        addUserBtn.addEventListener('click', () => {
            const userId = newUserId.value.trim();
            const name = newUserName.value.trim();
            if (!userId || !name) {
                alert("Please fill in both User ID and Name");
                return;
            }

            ws.send(JSON.stringify({ type: 'ADD_USER', userId, name }));
            newUserId.value = '';
            newUserName.value = '';
        });

        resetPrizesBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to reset prizes to default?")) {
                ws.send(JSON.stringify({ type: 'RESET_PRIZES' }));
            }
        });

        resetSpunsBtn.addEventListener('click', () => {
            if (confirm("Reset all user spin limits and clear winner history?")) {
                ws.send(JSON.stringify({ type: 'RESET_SPUN_USERS' }));
            }
        });
    </script>
</body>
</html>
