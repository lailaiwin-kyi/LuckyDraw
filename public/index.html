<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw Spin Wheel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 600px;
            width: 100%;
        }
        .user-info {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            text-align: center;
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ef4444;
            z-index: 10;
        }
        .spin-btn {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .spin-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .action-btn {
            background: #0ea5e9;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .status-text {
            font-size: 1rem;
            color: #94a3b8;
            min-height: 24px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal-card input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            text-align: center;
        }
        .modal-card button {
            background: #0ea5e9;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .error-msg {
            color: #f87171;
            font-size: 0.9rem;
            display: none;
            margin-top: 10px;
        }
        .history-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.9rem;
            color: #94a3b8;
            text-align: left;
        }
        .history-list li {
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-card" id="loginCard">
            <h2>Welcome to Lucky Draw</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 5px;">Enter your User ID to continue</p>
            <input type="text" id="userIdInput" placeholder="Enter User ID (e.g. ID001)">
            <button id="loginBtn">Start Draw</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </div>

    <!-- Winners List Modal -->
    <div class="modal-overlay" id="winnerModal" style="display: none;">
        <div class="modal-card" style="max-width: 450px;">
            <h2>🏆 Winner List</h2>
            <div style="margin: 15px 0;">
                <ul class="history-list" id="modalWinnerList"></ul>
            </div>
            <button id="closeWinnerBtn" style="background: #ef4444;">Close</button>
        </div>
    </div>

    <div class="container">
        <div class="user-info" id="userInfo">Not Logged In</div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="320" height="320"></canvas>
        </div>

        <button class="spin-btn" id="spinBtn" disabled>SPIN THE WHEEL</button>
        <button class="action-btn" id="viewWinnerBtn">🏆 View Winner List</button>
        
        <div class="status-text" id="statusText">Connecting to server...</div>
    </div>

    <script>
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}`);

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const statusText = document.getElementById('statusText');
        const userInfo = document.getElementById('userInfo');
        const loginModal = document.getElementById('loginModal');
        const loginCard = document.getElementById('loginCard');
        const userIdInput = document.getElementById('userIdInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        const winnerModal = document.getElementById('winnerModal');
        const viewWinnerBtn = document.getElementById('viewWinnerBtn');
        const closeWinnerBtn = document.getElementById('closeWinnerBtn');
        const modalWinnerList = document.getElementById('modalWinnerList');

        let prizes = [];
        let historyLog = [];
        let loggedInUserId = null;
        let loggedInUserName = null;
        let currentRotation = 0;

        function drawWheel() {
            if (prizes.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const numPrizes = prizes.length;
            const arcSize = (2 * Math.PI) / numPrizes;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(currentRotation);

            for (let i = 0; i < numPrizes; i++) {
                const angle = i * arcSize;
                const isWon = prizes[i].disabled || false;

                ctx.beginPath();
                ctx.fillStyle = isWon ? "#334155" : (prizes[i].color || (i % 2 === 0 ? "#0a4d70" : "#a11c47"));
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, angle, angle + arcSize);
                ctx.lineTo(0, 0);
                ctx.fill();

                // Draw Text
                ctx.save();
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = isWon ? "#64748b" : "#ffffff";
                ctx.font = "bold 14px Segoe UI";
                
                let labelText = prizes[i].label;
                if (isWon) labelText += " (WON)";
                ctx.fillText(labelText, radius - 20, 5);
                ctx.restore();
            }

            ctx.restore();
        }

        function updateHistoryUI() {
            const listHTML = historyLog.map(record => 
                `<li><strong>${record.userName}</strong> won <strong>${record.prize}</strong> at ${record.time}</li>`
            ).join('');

            modalWinnerList.innerHTML = listHTML || '<li>No winners yet!</li>';
        }

        // Modal Handlers
        viewWinnerBtn.addEventListener('click', () => {
            winnerModal.style.display = 'flex';
        });

        closeWinnerBtn.addEventListener('click', () => {
            winnerModal.style.display = 'none';
        });

        // WebSocket Event Listeners
        ws.onopen = () => {
            statusText.textContent = "Connected. Please log in.";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'INIT') {
                prizes = data.prizes;
                if (data.historyLog) historyLog = data.historyLog;
                drawWheel();
                updateHistoryUI();
            } 
            else if (data.type === 'LOGIN_RESPONSE') {
                if (data.success) {
                    loggedInUserId = data.userId;
                    loggedInUserName = data.userName;
                    loginModal.style.display = 'none';
                    userInfo.textContent = `👤 ${loggedInUserName} (${loggedInUserId})`;
                    statusText.textContent = "Ready to spin!";
                    
                    const availablePrizes = prizes.filter(p => !p.disabled);
                    const alreadyWon = historyLog.some(r => r.userId === loggedInUserId);
                    spinBtn.disabled = data.isSpinning || alreadyWon || availablePrizes.length === 0;
                } else {
                    loginError.style.display = 'block';
                    loginError.innerHTML = `⚠️ <strong>Error:</strong> ${data.error.toUpperCase()}`;
                    loginCard.classList.remove('shake-error');
                    void loginCard.offsetWidth;
                    loginCard.classList.add('shake-error');
                }
            }
            else if (data.type === 'START_SPIN') {
                spinBtn.disabled = true;
                statusText.textContent = `${data.userName} is spinning...`;

                const totalPrizes = prizes.length;
                const arcSize = (2 * Math.PI) / totalPrizes;
                const targetAngle = (2 * Math.PI) - (data.winningIndex * arcSize) - (arcSize / 2);
                
                const extraRounds = 5 * (2 * Math.PI);
                const finalRotation = extraRounds + targetAngle;

                const start = performance.now();
                const duration = 4000;

                function animateWheel(now) {
                    const elapsed = now - start;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);

                    currentRotation = finalRotation * easeOut;
                    drawWheel();

                    if (progress < 1) {
                        requestAnimationFrame(animateWheel);
                    }
                }
                requestAnimationFrame(animateWheel);
            }
            else if (data.type === 'SPIN_COMPLETE') {
                prizes = data.prizes;
                historyLog.unshift(data.winRecord);
                drawWheel();
                updateHistoryUI();

                if (data.userId === loggedInUserId) {
                    statusText.textContent = `🎉 Congratulations! You won ${data.wonPrize.label}!`;
                    spinBtn.disabled = true;
                } else {
                    statusText.textContent = `🎉 ${data.userName} won ${data.wonPrize.label}!`;
                    const availablePrizes = prizes.filter(p => !p.disabled);
                    if (loggedInUserId && !historyLog.some(r => r.userId === loggedInUserId) && availablePrizes.length > 0) {
                        spinBtn.disabled = false;
                    }
                }
            }
            else if (data.type === 'UPDATE_PRIZES') {
                prizes = data.prizes;
                drawWheel();
            }
            else if (data.type === 'SYSTEM_MESSAGE') {
                alert(data.message);
                location.reload();
            }
            else if (data.type === 'SPIN_ERROR') {
                alert(data.error);
                spinBtn.disabled = true;
            }
        };

        // User Login Action
        loginBtn.addEventListener('click', () => {
            const userId = userIdInput.value.trim();
            if (!userId) return;
            ws.send(JSON.stringify({ type: 'LOGIN_USER', userId }));
        });

        // Spin Action
        spinBtn.addEventListener('click', () => {
            if (!loggedInUserId) return;
            ws.send(JSON.stringify({ type: 'REQUEST_SPIN', userId: loggedInUserId }));
        });
    </script>
</body>
</html>
