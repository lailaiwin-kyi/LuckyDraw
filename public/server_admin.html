<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw - Admin Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #fff;
            padding: 30px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card h2 {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input, select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            width: 100%;
        }
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: #0ea5e9;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button.danger {
            background: #ef4444;
        }
        button.warning {
            background: #f59e0b;
        }
        ul {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }
        li {
            padding: 8px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>⚙️ Server Admin Dashboard</h1>

    <div class="grid">
        <!-- Prize Control Card -->
        <div class="card">
            <h2>Prize Control</h2>
            <div class="form-group">
                <input type="text" id="prizeLabel" placeholder="Prize Label (e.g. iPhone)">
                <input type="color" id="prizeColor" value="#0a4d70" style="width: 50px; padding: 2px;">
                <button id="addPrizeBtn">Add</button>
            </div>
            <ul id="prizeList"></ul>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="warning" id="resetPrizesBtn">Reset Default Prizes</button>
            </div>
        </div>

        <!-- System Reset Card -->
        <div class="card">
            <h2>System Controls</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">
                Resetting user spins will clear all winning records from MySQL database and allow users to spin again.
            </p>
            <button class="danger" id="resetSpunsBtn" style="width: 100%; padding: 12px;">🔄 Reset All User Spins (Database Reset)</button>
        </div>
    </div>

    <script>
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}`);

        const prizeLabel = document.getElementById('prizeLabel');
        const prizeColor = document.getElementById('prizeColor');
        const addPrizeBtn = document.getElementById('addPrizeBtn');
        const prizeList = document.getElementById('prizeList');
        const resetPrizesBtn = document.getElementById('resetPrizesBtn');
        const resetSpunsBtn = document.getElementById('resetSpunsBtn');

        let prizes = [];

        function renderPrizeList() {
            prizeList.innerHTML = prizes.map((prize, index) => `
                <li>
                    <span style="color: ${prize.color}">■ ${prize.label}</span>
                    <button class="danger" onclick="removePrize(${index})" style="padding: 4px 8px; font-size: 0.8rem;">Delete</button>
                </li>
            `).join('');
        }

        function removePrize(index) {
            ws.send(JSON.stringify({ type: 'REMOVE_PRIZE', index }));
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'INIT' || data.type === 'UPDATE_PRIZES') {
                prizes = data.prizes;
                renderPrizeList();
            }
        };

        addPrizeBtn.addEventListener('click', () => {
            const label = prizeLabel.value.trim();
            const color = prizeColor.value;
            if (!label) return;

            ws.send(JSON.stringify({ 
                type: 'ADD_PRIZE', 
                prize: { label, color } 
            }));
            prizeLabel.value = '';
        });

        resetPrizesBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to reset prizes to default?")) {
                ws.send(JSON.stringify({ type: 'RESET_PRIZES' }));
            }
        });

        resetSpunsBtn.addEventListener('click', () => {
            if (confirm("Reset all user spin limits in MySQL Database?")) {
                ws.send(JSON.stringify({ type: 'RESET_SPUN_USERS' }));
            }
        });
    </script>
</body>
</html>
