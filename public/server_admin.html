<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw - Control Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0b1120;
            color: #fff;
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .status-badge {
            background: #0284c7;
            color: #e0f2fe;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }
        .card {
            background: #162032;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #24334a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #2d3f5d;
            background: #0b1120;
            color: #fff;
            width: 100%;
        }
        button {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            background: #0ea5e9;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button.danger {
            background: #ef4444;
        }
        button.warning {
            background: #f97316;
        }
        ul {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
        }
        li {
            padding: 10px 12px;
            border-bottom: 1px solid #202d42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .valid-ids {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .id-badge {
            background: #0f2d3e;
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid #1e4f6e;
        }
        .winner-item {
            padding: 12px;
            background: #0d1726;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            border-left: 3px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CONTROL CENTER</h1>
        <div class="status-badge">
            <span class="status-dot"></span> LIVE SERVER CONNECTED
        </div>
    </div>

    <div class="grid">
        <!-- Wheel Prize Manager Card -->
        <div class="card">
            <h2>⚙️ Wheel Prize Manager</h2>
            <div class="form-group">
                <input type="text" id="prizeLabel" placeholder="New Prize Name">
                <input type="color" id="prizeColor" value="#0a4d70" style="width: 50px; padding: 2px; cursor: pointer;">
                <button id="addPrizeBtn">Add</button>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-size: 0.85rem; color: #64748b;">Active Wheel Items</span>
                <button class="warning" id="resetPrizesBtn" style="padding: 6px 12px; font-size: 0.8rem;">Reset Default</button>
            </div>

            <ul id="prizeList"></ul>
        </div>

        <!-- User Access & Audit Logs Card -->
        <div class="card">
            <h2>👥 User Access & Audit Logs</h2>
            
            <div style="margin-bottom: 15px;">
                <span style="font-size: 0.75rem; color: #64748b; display: block; margin-bottom: 6px;">VALID IDs:</span>
                <div class="valid-ids">
                    <span class="id-badge">ID001</span>
                    <span class="id-badge">ID002</span>
                    <span class="id-badge">ID003</span>
                    <span class="id-badge">ID004</span>
                    <span class="id-badge">ID005</span>
                </div>
            </div>

            <button class="warning" id="resetSpunsBtn" style="width: 100%; padding: 12px; font-size: 0.95rem; margin-bottom: 20px;">
                Reset Spin Limits for All Users
            </button>

            <h3 style="font-size: 0.95rem; color: #cbd5e1; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
                📜 Private Server Winner History
            </h3>
            
            <div id="winnerHistory" style="max-height: 200px; overflow-y: auto;">
                <p style="color: #64748b; font-size: 0.85rem;">No winners yet...</p>
            </div>
        </div>
    </div>

    <script>
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}`);

        const prizeLabel = document.getElementById('prizeLabel');
        const prizeColor = document.getElementById('prizeColor');
        const addPrizeBtn = document.getElementById('addPrizeBtn');
        const prizeList = document.getElementById('prizeList');
        const resetPrizesBtn = document.getElementById('resetPrizesBtn');
        const resetSpunsBtn = document.getElementById('resetSpunsBtn');
        const winnerHistory = document.getElementById('winnerHistory');

        let prizes = [];

        function renderPrizeList() {
            prizeList.innerHTML = prizes.map((prize, index) => `
                <li>
                    <span style="color: ${prize.color}; font-weight: 600;">■ ${prize.label}</span>
                    <button class="danger" onclick="removePrize(${index})" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
                </li>
            `).join('');
        }

        function renderWinnerList(winners) {
            if (!winners || winners.length === 0) {
                winnerHistory.innerHTML = '<p style="color: #64748b; font-size: 0.85rem;">No winners yet...</p>';
                return;
            }

            winnerHistory.innerHTML = winners.map(w => `
                <div class="winner-item">
                    🏆 <strong>${w.name}</strong> (${w.user_id}) won <span style="color: #38bdf8; font-weight: bold;">${w.won_prize}</span>
                </div>
            `).join('');
        }

        function removePrize(index) {
            ws.send(JSON.stringify({ type: 'REMOVE_PRIZE', index }));
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'INIT' || data.type === 'UPDATE_PRIZES') {
                prizes = data.prizes;
                renderPrizeList();
                if (data.winners) renderWinnerList(data.winners);
            }

            if (data.type === 'UPDATE_WINNERS') {
                renderWinnerList(data.winners);
            }
        };

        addPrizeBtn.addEventListener('click', () => {
            const label = prizeLabel.value.trim();
            const color = prizeColor.value;
            if (!label) return;

            ws.send(JSON.stringify({ 
                type: 'ADD_PRIZE', 
                prize: { label, color } 
            }));
            prizeLabel.value = '';
        });

        resetPrizesBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to reset prizes to default?")) {
                ws.send(JSON.stringify({ type: 'RESET_PRIZES' }));
            }
        });

        resetSpunsBtn.addEventListener('click', () => {
            if (confirm("Reset all user spin limits and clear winner history?")) {
                ws.send(JSON.stringify({ type: 'RESET_SPUN_USERS' }));
            }
        });
    </script>
</body>
</html>
